spring.application.name=script_back

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=initial-baseline-decision-engine

spring.main.banner-mode=off

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.mariadb.jdbc=WARN

script.security.jwt.secret=${SCRIPT_JWT_SECRET:dev-only-change-me-golden-script-2026}
script.security.jwt.expiration-ms=${SCRIPT_JWT_EXPIRATION_MS:28800000}

script.security.bootstrap.enabled=${SCRIPT_SECURITY_BOOTSTRAP_ENABLED:true}
script.security.bootstrap.username=${SCRIPT_SECURITY_BOOTSTRAP_USERNAME:admin}
script.security.bootstrap.password=${SCRIPT_SECURITY_BOOTSTRAP_PASSWORD:ChangeMeDev2026!}
script.security.bootstrap.display-name=${SCRIPT_SECURITY_BOOTSTRAP_DISPLAY_NAME:Administrateur}