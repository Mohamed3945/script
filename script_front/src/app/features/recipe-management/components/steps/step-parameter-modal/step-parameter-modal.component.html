<div class="modal-backdrop" *ngIf="visible">
  <div class="modal-card modal-card--large">
    <div class="modal-card__header">
      <h3>Add step parameter</h3>
      <button class="close-btn" (click)="closed.emit()">x</button>
    </div>

    <app-step-parameter-form
      [visible]="visible"
      [stepKind]="stepKind"
      [parentCandidates]="parentCandidates"
      [excludedDefinitionIds]="excludedDefinitionIds"
      (submitted)="submitted.emit($event)">
    </app-step-parameter-form>
  </div>
</div>
