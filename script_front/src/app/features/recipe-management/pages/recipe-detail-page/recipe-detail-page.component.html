<section class="page" *ngIf="recipe$ | async as recipe">
  <div class="page__container">
    <app-recipe-detail-header
      [recipe]="recipe"
      (editClicked)="onEditRecipe()"
      (deleteClicked)="onDeleteRecipe()">
    </app-recipe-detail-header>

    <div class="workspace">
      <aside class="workspace__sidebar">
        <app-recipe-summary-sidecard [recipe]="recipe"></app-recipe-summary-sidecard>

        <div class="workspace__sidebar-section">
          <app-recipe-tab-nav
            [activeTab]="activeTab"
            (tabChanged)="activeTab = $event">
          </app-recipe-tab-nav>
        </div>
      </aside>

      <main class="workspace__main">
        <div *ngIf="activeTab === 'summary'" class="info-card">
          <h3>Recipe Summary</h3>
          <p>
            Use this recipe workspace to inspect structure, browse steps, compare parameter values
            in matrix view, or focus on one step at a time.
          </p>
        </div>

        <div *ngIf="activeTab === 'prestep'" class="info-card">
          <div class="prestep-header">
            <h3>Prestep</h3>

            <button class="btn" *ngIf="prestepStep" (click)="openPrestepParameterModal()">
              Add parameter
            </button>
          </div>

          <table *ngIf="(prestepRows$ | async) as prestepRows; else noPrestepParameters" class="prestep-table">
            <thead>
              <tr>
                <th>Parameter</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of prestepRows">
                <td>{{ row.parameter }}</td>
                <td>{{ row.value }}</td>
              </tr>
              <tr *ngIf="prestepRows.length === 0">
                <td colspan="2">No PRESTEP parameters found.</td>
              </tr>
            </tbody>
          </table>

          <ng-template #noPrestepParameters>
            <p>No PRESTEP parameters found.</p>
          </ng-template>
        </div>

        <ng-container *ngIf="activeTab === 'steps'">
          <section class="steps-shell">
            <div class="steps-shell__content">
              <app-recipe-matrix-view
                *ngIf="viewMode === 'matrix'"
                [matrix]="(stepsViewMatrix$ | async)"
                (addStepClicked)="openStepModal()"
                (cellUpdated)="onMatrixCellUpdated($event)">
              </app-recipe-matrix-view>

              <app-recipe-step-focus-view
                *ngIf="viewMode === 'focus'"
                [steps]="(stepsViewSteps$ | async) ?? []"
                [selectedStepId]="(stepsViewSelectedStep$ | async)?.id"
                [selectedStep]="(stepsViewSelectedStep$ | async)"
                [parameters]="(stepParameters$ | async) ?? []"
                (stepSelected)="onStepSelected($event)"
                (addParameterClicked)="openStepParameterModal()"
                (deleteParameterClicked)="onDeleteStepParameter($event)">
              </app-recipe-step-focus-view>
            </div>

            <div class="steps-shell__subnav">
              <app-recipe-view-switch
                [mode]="viewMode"
                (modeChanged)="viewMode = $event">
              </app-recipe-view-switch>
            </div>
          </section>
        </ng-container>
      </main>
    </div>
  </div>

  <app-step-modal
    [visible]="showStepModal"
    (closed)="closeStepModal()"
    (submitted)="onCreateStep($event)">
  </app-step-modal>

  <app-step-parameter-modal
    [visible]="showStepParameterModal"
    [stepKind]="modalStepKind"
    [parentCandidates]="modalParentCandidates"
    (closed)="closeStepParameterModal()"
    (submitted)="onCreateStepParameter($event)">
  </app-step-parameter-modal>
</section>
