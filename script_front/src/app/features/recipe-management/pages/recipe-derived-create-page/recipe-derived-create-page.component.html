<section class="page">
  <div class="page__container">
    <div class="page__header">
      <h1>Create derived recipe</h1>
      <p>Create a recipe derived from a questionnaire result or a selected parent recipe.</p>
    </div>

    <app-recipe-form
      [initialValue]="initialRecipe"
      mode="derived"
      (submitted)="onSubmit($event)">
    </app-recipe-form>
  </div>
</section>
