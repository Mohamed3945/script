<aside class="wizard-sidebar">
  <div class="wizard-sidebar__panel">
    <div class="wizard-sidebar__header">
      <i class="ti ti-list-details"></i>
      <span>Selections so far</span>
    </div>

    <app-recap-list [selections]="selections"></app-recap-list>
  </div>

  <div class="wizard-sidebar__hint">
    <div class="wizard-sidebar__hint-title">
      <i class="ti ti-bulb"></i>
      <span>How it works</span>
    </div>
    <p>
      Each answer narrows the decision path. The wizard adapts dynamically —
      some paths are shorter depending on your process context.
    </p>
  </div>
</aside>
