<section class="page">
  <div class="page__container">
    <div class="page__header">
      <div>
        <h1>Configuration definitions</h1>
        <p>Manage reusable chamber configuration definitions.</p>
      </div>

      <button class="btn" (click)="createDefinition()">New definition</button>
    </div>

    <ng-container *ngIf="definitions$ | async as definitions">
      <app-definition-table
        [definitions]="definitions"
        (edit)="editDefinition($event)"
        (delete)="deleteDefinition($event)">
      </app-definition-table>
    </ng-container>
  </div>
</section>
