<div class="table-card">
  <table *ngIf="definitions.length > 0; else emptyState" class="table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Value type</th>
        <th>Unit</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let definition of definitions">
        <td>{{ definition.code }}</td>
        <td>{{ definition.name }}</td>
        <td>{{ definition.valueType }}</td>
        <td>{{ definition.unit ?? '—' }}</td>
        <td class="actions">
          <button class="link-btn" (click)="edit.emit(definition)">Edit</button>
          <button class="link-btn link-btn--danger" (click)="delete.emit(definition)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #emptyState>
    <div class="empty-state">No configuration definitions found.</div>
  </ng-template>
</div>
