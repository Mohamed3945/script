<div class="summary-card">
  <div class="summary-item">
    <span class="label">Code</span>
    <span class="value">{{ machine.code }}</span>
  </div>

  <div class="summary-item">
    <span class="label">Name</span>
    <span class="value">{{ machine.name }}</span>
  </div>

  <div class="summary-item">
    <span class="label">Platform</span>
    <span class="value">{{ machine.platformType }}</span>
  </div>

  <div class="summary-item">
    <span class="label">Chamber count</span>
    <span class="value">{{ machine.chambers.length }}</span>
  </div>
</div>
