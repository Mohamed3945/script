<div class="table-card">
  <div class="table-toolbar">
    <input
      class="table-filter"
      type="text"
      placeholder="Filter machines..."
      [value]="filterText"
      (input)="onFilterChange($any($event.target).value)"
    />
    <div class="table-meta">{{ filteredMachines.length }} item(s)</div>
  </div>

  <div class="table-scroll" *ngIf="filteredMachines.length > 0; else emptyState">
    <table class="table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Platform</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let machine of pagedMachines">
        <td>{{ machine.code }}</td>
        <td>{{ machine.name }}</td>
        <td>{{ machine.platformType }}</td>
        <td class="actions">
          <button class="link-btn" (click)="view.emit(machine)">Open</button>
          <button class="link-btn" (click)="edit.emit(machine)">Edit</button>
          <button class="link-btn link-btn--danger" (click)="delete.emit(machine)">Delete</button>
        </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-pagination" *ngIf="filteredMachines.length > 0">
    <button class="pager-btn" (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
    <span>Page {{ currentPage }} / {{ totalPages }}</span>
    <button class="pager-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">No machines found.</div>
  </ng-template>
</div>
