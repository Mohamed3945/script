<form [formGroup]="form" class="form-card" (ngSubmit)="onSubmit()">
  <div class="form-grid">
    <div class="field">
      <label>Code</label>
      <input type="text" formControlName="code" />
    </div>

    <div class="field">
      <label>Name</label>
      <input type="text" formControlName="name" />
    </div>
  </div>

  <div class="actions">
    <button class="btn" type="submit">
      {{ mode === 'create' ? 'Create chamber' : 'Save changes' }}
    </button>
  </div>
</form>
