<div class="summary-card">
  <div class="summary-item">
    <span class="label">Machine</span>
    <span class="value">{{ chamber.machineCode }} — {{ chamber.machineName }}</span>
  </div>

  <div class="summary-item">
    <span class="label">Chamber code</span>
    <span class="value">{{ chamber.code }}</span>
  </div>

  <div class="summary-item">
    <span class="label">Chamber name</span>
    <span class="value">{{ chamber.name }}</span>
  </div>

  <div class="summary-item">
    <span class="label">Capability count</span>
    <span class="value">{{ chamber.capabilities.length }}</span>
  </div>

  <div class="summary-item">
    <span class="label">Configuration count</span>
    <span class="value">{{ chamber.configurations.length }}</span>
  </div>
</div>
